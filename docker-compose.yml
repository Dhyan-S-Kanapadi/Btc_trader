services:
  postgres:
    image: postgres:16
    environment:
      # Local development defaults only. They are not production credentials.
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: paper
      POSTGRES_DB: paper_trader
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-readonly.sql:/docker-entrypoint-initdb.d/10-readonly.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build: .
    environment:
      # Local-only connection string. It is not a production credential.
      DATABASE_URL: postgresql+psycopg://paper:paper@postgres:5432/paper_trader
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--help"]

  api:
    build: .
    environment:
      DATABASE_URL_READONLY: postgresql+psycopg://paper_readonly:paper_readonly_local@postgres:5432/paper_trader
      TRADER_API__ALLOWED_ORIGINS: ${TRADER_API__ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["api"]

volumes:
  postgres_data:
